name: Promote Nightly Fill

run-name: Promote Nightly Fill to tests@${{ inputs.version }}

# Promote a nightly fill to a draft `tests@` release without refilling.
# Scheduled runs of `release_fixtures.yaml` already build the mainnet
# `tests` feature into a release-shaped `fixtures_tests` artifact; this
# workflow downloads the newest live one and drafts the same release a
# manual `tests` dispatch would produce, targeted at the exact commit
# the nightly built. The git tag is only created when the draft is
# published. Runs in minutes on a hosted runner; nothing is filled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v5.0.0. Must be greater than the newest tests@ tag."
        required: true
        type: string
      run_id:
        description: "Nightly run id to promote. Defaults to the newest with a live artifact."
        required: false
        type: string

concurrency:
  # One promotion at a time: drafts do not reserve their tag name, so
  # parallel promotions of the same version would silently coexist.
  group: promote-nightly
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: false
      - uses: ./.github/actions/setup-uv

      - name: Resolve the nightly run to promote
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          # Version, run and ancestry validation lives in (and is
          # unit-tested via) promote_nightly.py.
          uv run -q .github/scripts/promote_nightly.py >> "$GITHUB_OUTPUT"

      - name: Download the nightly fixture tarball
        shell: bash
        env:
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$RUN_ID" -n fixtures_tests --dir ./artifacts

      - name: Draft release
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          PREV_TAG: ${{ steps.resolve.outputs.prev_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Mirrors the `release` job in `release_fixtures.yaml`, minus
          # the feature namespacing: only the mainnet `tests` feature is
          # ever promoted, so the tag is always `tests@vX.Y.Z` and the
          # nightly's target SHA (not the dispatch commit) is tagged.
          TAG_NAME="tests@${INPUT_VERSION}"

          # All fixture releases are drafted as prereleases; publish
          # manually. Publishing creates the tag on the target commit.
          RELEASE_ARGS=(
            --draft
            --prerelease
            --generate-notes
            --target "$TARGET_SHA"
            --title "$TAG_NAME"
          )
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi

          gh release create "$TAG_NAME" "${RELEASE_ARGS[@]}" ./artifacts/fixtures.tar.gz
