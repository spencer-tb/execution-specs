[tox]
min_version = 4.0
requires =
    tox-uv >=0.2.0
envlist =
    py3
	pypy3
	json_infra
	static
	eest-lint
	eest-typecheck
	eest-pytest
	eest-tests-deployed
	eest-tests-deployed-benchmark
	eest-tests-develop
	eest-changelog
	eest-mkdocs

[testenv]
package = uv
uv_seed = false

[forks]
develop = Osaka

[eest]
runner = uv-venv-lock-runner
package = editable
wheel_build_env = .pkg
python_source_dirs = src/ethereum_spec_tests tests/eest # .github/scripts
ruff_config = ruff.eest.toml
mypy_config = mypy.eest.ini

# EELS

[testenv:static]
description = Run linting (ruff), spellcheck (codespell), and type validation (mypy)
extras =
    lint
    optimized
    test
    doc
commands =
    codespell -I whitelist.txt src tests --skip 'src/ethereum_spec_tests tests/eest'
    ruff check src tests
    ruff format src tests --check
    mypy src tests --exclude "src/ethereum_spec_tests/*|tests/json_infra/fixtures/*|tests/eest/*" --namespace-packages
    ethereum-spec-lint
    uv lock --check

[testenv:json_infra]
description = Runs all fixture texts from JSON vector files
extras =
    test
commands =
    pytest \
        -m "not slow" \
        -n auto --maxprocesses 6 \
        --cov-config=pyproject.toml \
        --cov=ethereum \
        --cov-report=term \
        --cov-report "xml:{toxworkdir}/coverage.xml" \
        --no-cov-on-fail \
        --cov-branch \
        --ignore-glob='tests/json_infra/fixtures/*' \
        --basetemp="{temp_dir}/pytest" \
        tests/json_infra

[testenv:py3]
description = Runs tests directly from python files using CPython
extras =
    test
	fill
commands =
    fill \
        -m "not slow and not zkevm and not benchmark" \
        -n auto --maxprocesses 10 --dist=loadgroup \
        --basetemp="{temp_dir}/pytest" \
        --clean \
        --until Osaka \
        tests/eest

[testenv:pypy3]
description = Runs tests directly from python files using PyPy
extras =
    test
	fill
passenv =
    PYPY_GC_MAX
    PYPY_GC_MIN
commands =
    fill \
        --skip-index \
        --no-html \
        --tb=no \
        --show-capture=no \
        --disable-warnings \
        -m "not slow and not zkevm and not benchmark" \
        -n auto --maxprocesses 7 --dist=loadgroup \
        --basetemp="{temp_dir}/pytest" \
        --clean \
        --until Osaka \
        tests/eest

[testenv:optimized]
description = Runs optimized tests directly from python files using PyPy
extras =
    test
    optimized
passenv =
    PYPY_GC_MAX
    PYPY_GC_MIN
commands =
    pytest \
        -m "not slow and not evm_tools" \
        -n auto --maxprocesses 5 \
        --ignore-glob='tests/json_infra/fixtures/*' \
        --ignore-glob='tests/test_t8n.py' \
        --ignore-glob='eest_tests/*' \
        --basetemp="{temp_dir}/pytest" \
        --optimized \
        tests/json_infra

[testenv:doc]
description = Generates EELS documentation by using the docc tool
extras = doc
basepython = python3
commands =
    docc --output "{toxworkdir}/docs"
    python -c 'import pathlib; print("documentation available under file://\{0\}".format(pathlib.Path(r"{toxworkdir}") / "docs" / "index.html"))'

# EEST

# WORKING
[testenv:eest-lint]
description = Lint and code formatting checks (ruff)
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
extras = lint
commands =
    ruff check --config {[eest]ruff_config} --no-fix --show-fixes {[eest]python_source_dirs}
    ruff format --config {[eest]ruff_config} --check {[eest]python_source_dirs}

# WORKING
[testenv:eest-typecheck]
description = Run type checking (mypy)
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
extras = test
	fill
	lint
commands = mypy --config-file {[eest]mypy_config} {[eest]python_source_dirs}

# WORKING
[testenv:eest-spellcheck]
description = Spellcheck EEST code and documentation (codespell)
extras = docs
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
passenv =
    GITHUB_ACTIONS
    GITHUB_STEP_SUMMARY
commands =
    codespell --ignore-words=whitelist-eest.txt {[eest]python_source_dirs} docs

# WORKING
[testenv:eest-changelog]
description = Validate EEST changelog entries
extras = docs
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
commands = python -c "import src.ethereum_spec_tests.cli.tox_helpers; src.ethereum_spec_tests.cli.tox_helpers.validate_changelog()"

# BROKEN Doc generation fails (exit: 1, TESTS_FAILED)
# ERROR   -  Script 'docs/scripts/gen_test_case_reference.py' caused SystemExit(1)
[testenv:eest-mkdocs]
description = Build EEST documentation with mkdocs
extras = docs,lint, test
setenv =
    GEN_TEST_DOC_VERSION = "tox"
    # Required for `cairosvg` so tox can find `libcairo-2`?
    # https://squidfunk.github.io/mkdocs-material/plugins/requirements/image-processing/?h=cairo#cairo-library-was-not-found
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
commands =
    ruff check --no-fix --show-fixes docs/scripts
    ruff format --check docs/scripts
    mkdocs build --strict

# WORKING
[testenv:eest-markdownlint]
description = Lint EEST markdown files (markdownlint)
extras = docs
runner = {[eest]runner}
package = {[eest]package}
commands = python -c "import src.ethereum_spec_tests.cli.tox_helpers; src.ethereum_spec_tests.cli.tox_helpers.markdownlint()"

# BROKEN conftest.py fails to import cls.default_binary because it does not think that it is installed. Related to other broken import issue?
[testenv:eest-pytest]
description = Run library and framework unit tests (pytest)
setenv =
    # Use custom EELS_RESOLUTIONS_FILE if it is set via the environment (eg in CI)
    EELS_RESOLUTIONS_FILE = {env:EELS_RESOLUTIONS_FILE:}
    CI = {env:CI:}
extras =
    test
    fill
    lint # Required `gentest` for formatting tests
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
commands =
    pytest -n auto ./src/ethereum_spec_tests

# WORKING
[testenv:eest-tests-deployed]
description = Fill test cases in ./tests/ for deployed mainnet forks except for slow/benchmark tests.
extras = test, fill
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
setenv =
    # Use custom EELS_RESOLUTIONS_FILE if it is set via the environment (eg in CI)
    EELS_RESOLUTIONS_FILE = {env:EELS_RESOLUTIONS_FILE:}
commands = fill -n auto -m "not slow" --output=/tmp/fixtures-tox --clean

# HIVE EXCLUSIVE? Can't locate evmone-t8n
[testenv:eest-tests-deployed-benchmark]
description = Fill benchmarking test cases in ./tests/ for deployed mainnet forks using evmone-t8n.
extras = test, fill
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
commands = fill -n auto -m "benchmark" --gas-benchmark-values 5 --output=/tmp/fixtures-tox --clean --evm-bin=src/ethereum_spec_tests/ethereum_clis/clis/evmone.py

# WORKING
[testenv:eest-tests-develop]
description = Fill test cases in ./tests/ for deployed and development mainnet forks
extras = test, fill
runner = {[eest]runner}
package = {[eest]package}
wheel_build_env = {[eest]wheel_build_env}
setenv =
    # Use custom EELS_RESOLUTIONS_FILE if it is set via the environment (eg in CI)
    EELS_RESOLUTIONS_FILE = {env:EELS_RESOLUTIONS_FILE:}
commands = fill -n auto --until={[forks]develop} -k "not slow" --output=/tmp/fixtures-tox --clean

# WORKING
[testenv:eest-docs]
description = Alias that runs all documentation checks (spellcheck, markdownlint, mkdocs).
extras =
    {[testenv:eest-spellcheck]extras}
    {[testenv:eest-markdownlint]extras}
    {[testenv:eest-mkdocs]extras}
runner = {[eest]runner}
package = {[eest]package}
setenv =
    {[testenv:eest-mkdocs]setenv}
commands =
    {[testenv:eest-spellcheck]commands}
    {[testenv:eest-markdownlint]commands}
    {[testenv:eest-mkdocs]commands}
